[package]
name = "bot"
description = "The trading bot binary: parse args, wire the crates together, run the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { workspace = true }
engine = { workspace = true }
settings = { workspace = true }
# The only crate in the workspace that names a concrete strategy - and, from
# milestone 2, a concrete market source. `engine` depends on neither.
exchange = { workspace = true }
strategy = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
# The binary picks the runtime flavour; libraries do not.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The end-to-end tests point the real binary at a local fake WebSocket server
# rather than at the live testnet, so `cargo test` never touches the network.
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
# `net`/`time` for the fake feed's listener and pacing; `rt` for the thread it
# runs on. The binary itself needs none of these.
tokio = { workspace = true, features = ["net", "rt", "time"] }

[lints]
workspace = true
