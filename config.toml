# Sample TESTNET configuration. Checked in on purpose - it contains NO secrets.
# Credentials live only in the environment (see .env.example).
#
# Any field here can be overridden by an APP_-prefixed environment variable,
# using a double underscore for nesting: APP_LOGGING__LEVEL=debug
environment = "testnet"

[binance]
spot_rest_url  = "https://testnet.binance.vision"
# The COMBINED-stream endpoint (`/stream`), not the raw one (`/ws`).
#
# Confirmed against the current Binance spot docs: wrapping is a property of the
# path. `/ws` delivers payloads unwrapped, so on a connection carrying more than
# one stream nothing in a frame says which stream it came from - and bookTicker
# payloads carry no `"e"` event type to infer it from either. `/stream` wraps
# every payload as {"stream":"<name>","data":{...}}, which is what normalization,
# gap detection, and the recording all treat as ground truth.
spot_ws_url    = "wss://stream.testnet.binance.vision/stream"
recv_window_ms = 5000

[market]
symbols       = ["BTCUSDT"]
streams       = ["book_ticker", "trade"]
# A liquid pair ticks several times a second, so ten seconds of silence on a
# subscribed stream is already well past anomalous.
staleness_ms  = 10000

[filters]
# Symbol filters are exchange state that changes, so they are refetched rather
# than cached forever. `exchangeInfo` costs 20 request weight out of 6000 per
# minute, so five minutes between fetches is nothing; fifteen minutes of maximum
# age leaves room for two refreshes to fail before the book is refused.
#
# max_age_ms MUST be greater than refresh_interval_ms, or the book would be
# stale before it could be refreshed - a config that can never be fresh refuses
# to load.
refresh_interval_ms = 300000
max_age_ms          = 900000

[recording]
# Raw inbound payloads plus ingest metadata, as newline-delimited JSON. Enabled
# by default: capturing the stream is the point of this milestone, and an
# unwritable directory refuses to start rather than running unrecorded.
enabled = true
dir     = "recordings"

[logging]
level = "info"
json  = false
