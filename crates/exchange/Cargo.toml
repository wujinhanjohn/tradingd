[package]
name = "exchange"
description = "Binance adapter: read-only market-data ingest, normalization, and recording."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The HTTP client arrives in milestone 3, and there is exactly one of it - see
# the workspace manifest for why it is `ureq` on rustls+ring. `reqwest`/`hyper`/
# `native-tls`/`aws-lc-rs` stay out of the workspace entirely.
[dependencies]
domain = { workspace = true }

futures-util = { workspace = true }
# Only for installing the TLS crypto provider - see `binance::install_crypto_provider`.
# No rustls types appear in this crate's own API.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `time` for backoff/staleness/refresh deadlines, `sync` for the channel to the
# engine and the filter-book watch, `macros` for the read loop's `select!`,
# `rt` for `spawn_blocking` around the blocking HTTP client. The runtime flavour
# is still the binary's choice, so no `rt-multi-thread` here.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# The fake WebSocket server the connection tests run against: a real server on
# 127.0.0.1:0, so the tests drive the real constructor and the real socket code
# without ever touching the live testnet.
tokio = { workspace = true, features = ["io-util", "net", "rt", "test-util"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
